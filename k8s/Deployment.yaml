apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-k8s
  template:
    metadata:
      labels:
        app: project-k8s
    spec:
      containers:
      - name: project-k8s
        image: coursediy/node-image:latest
        ports:
        - containerPort: 3000
